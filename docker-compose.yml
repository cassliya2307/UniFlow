services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/server/prisma/dev.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - set in .env or environment}
      - PORT=3000
      - CLIENT_URL=http://localhost:3000
      - UPLOAD_DIR=/app/uploads
      - MAX_FILES=5
    volumes:
      - db_data:/app/server/prisma
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  db_data:
  uploads_data:
